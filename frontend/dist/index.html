<!doctype html>
<html lang="fr" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Typst IDE</title>
        <!-- <link rel="stylesheet" href="css/app.css"> -->

        <!--<script type="module" src="main.js"></script>-->
      <script type="module" crossorigin src="./index.js"></script>
      <link rel="modulepreload" crossorigin href="./i18n.js">
      <link rel="stylesheet" crossorigin href="./i18n.css">
      <link rel="stylesheet" crossorigin href="./index.css">
    </head>
    <body>
        <div class="app-layout">
            <!-- ## Navbar ############################################### -->
            <nav class="navbar">
                <div class="navbar-brand">
                    <span id="title-typst">Typst</span>
                    <span id="title-ide">IDE</span>
                </div>

                <div class="navbar-menu">
                    <!-- Fichier -->
                    <div class="menu-item">
                        <button class="menu-trigger" data-i18n="menu.file">Fichier</button>
                        <ul class="dropdown">
                            <li>
                                <button id="new-project">
                                    <span data-i18n="menu.new_project">Nouveau projet</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">shift</kbd>
                                        <kbd class="kbd kbd-md">N</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="open-project">
                                    <span data-i18n="menu.open_project">Ouvrir un projet</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">shift</kbd>
                                        <kbd class="kbd kbd-md">O</kbd>
                                    </div>
                                </button>
                            </li>
                        </ul>
                    </div>

                    <!-- Édition -->
                    <div class="menu-item">
                        <button class="menu-trigger" data-i18n="menu.edit">Édition</button>
                        <ul class="dropdown">
                            <li>
                                <button id="action-undo">
                                    <span data-i18n="menu.undo">Annuler</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">Z</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="action-redo">
                                    <span data-i18n="menu.redo">Rétablir</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">Y</kbd>
                                    </div>
                                </button>
                            </li>
                            <li class="separator"></li>
                            <li>
                                <button id="action-search">
                                    <span data-i18n="menu.search">Chercher</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">F</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="action-replace">
                                    <span data-i18n="menu.replace">Remplacer</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">H</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="action-goto">
                                    <span data-i18n="menu.goto_line">Aller à la ligne</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">G</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="action-comment">
                                    <span data-i18n="menu.comment_line">Commenter la ligne</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">/</kbd>
                                    </div>
                                </button>
                            </li>
                            <li class="separator"/>
                            <li>
                                <button id="open-notepad" data-i18n="menu.open_notepad">
                                    Ouvrir le bloc-note
                                </button>
                            </li>
                            <li>
                                <button id="manage-project-files" data-i18n="menu.manage_files">
                                    Gérer les fichiers du projet
                                </button>
                            </li>
                            <li>
                                <button id="manage-bibliography" data-i18n="menu.manage_bibliography">
                                    Gérer les bibliographies
                                </button>
                            </li>
                            <li>
                                <button id="manage-templates" data-i18n="template.menu">
                                    Gérer les templates
                                </button>
                            </li>
                        </ul>
                    </div>

                    <!-- Vue -->
                    <div class="menu-item">
                        <button class="menu-trigger" data-i18n="menu.view">Vue</button>
                        <ul class="dropdown">
                            <li>
                                <button id="webview-zoom-in">
                                    <span data-i18n="menu.zoom_in">Agrandir</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">shift</kbd>
                                        <kbd class="kbd kbd-md">+</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="webview-zoom-out">
                                    <span data-i18n="menu.zoom_out">Rétrécir</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">shift</kbd>
                                        <kbd class="kbd kbd-md">-</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="webview-zoom-reset">
                                    <span data-i18n="menu.zoom_reset">Réinitialiser</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">shift</kbd>
                                        <kbd class="kbd kbd-md">0</kbd>
                                    </div>
                                </button>
                            </li>
                            <li class="separator"></li>
                            <li>
                                <button id="editor-zoom-in">
                                    <span data-i18n="menu.editor_zoom_in">Agrandir l'éditeur</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">alt</kbd>
                                        <kbd class="kbd kbd-md">+</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="editor-zoom-out">
                                    <span data-i18n="menu.editor_zoom_out">Rétrécir l'éditeur</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">alt</kbd>
                                        <kbd class="kbd kbd-md">-</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="editor-zoom-reset">
                                    <span data-i18n="menu.editor_zoom_reset">Réinitialiser l'éditeur</span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">alt</kbd>
                                        <kbd class="kbd kbd-md">0</kbd>
                                    </div>
                                </button>
                            </li>
                            <li class="separator"></li>
                            <li>
                                <button id="toggle-console">
                                    <span class="console-label-group">
                                        <span data-i18n="menu.console">Console</span>
                                        <span id="console-error-badge" class="console-error-badge hidden">&#9679;</span>
                                    </span>
                                    <div>
                                        <kbd class="kbd kbd-md">ctrl</kbd>
                                        <kbd class="kbd kbd-md">E</kbd>
                                    </div>
                                </button>
                            </li>
                            <li>
                                <button id="console-ignore-btn" data-i18n="menu.console_ignore">
                                    Ignorer des erreurs
                                </button>
                            </li>
                            <li class="separator"></li>
                            <li>
                                <label class="menu-checkbox">
                                    <span class="checkbox-box">
                                        <input
                                            type="checkbox"
                                            id="auto-compile"
                                            checked
                                        />
                                        <span class="material-symbols-outlined checkbox-check">check</span>
                                    </span>
                                    <span data-i18n="menu.auto_compile">Auto-compilation</span>
                                </label>
                            </li>
                            <li>
                                <label class="menu-checkbox">
                                    <span class="checkbox-box">
                                        <input
                                            type="checkbox"
                                            id="show-console-on-error"
                                        />
                                        <span class="material-symbols-outlined checkbox-check">check</span>
                                    </span>
                                    <span data-i18n="menu.console_on_error">Afficher la console en cas d'erreur</span>
                                </label>
                            </li>
                        </ul>
                    </div>

                    <!-- Aide -->
                    <div class="menu-item">
                        <button class="menu-trigger" data-i18n="menu.help">Aide</button>
                        <ul class="dropdown">
                            <li>
                                <button id="editor-fontfamily-btn" data-i18n="menu.change_font">
                                    Changer la police de l'éditeur
                                </button>
                            </li>
                            <li>
                                <button id="open-tutorial" data-i18n="menu.tutorial">
                                    Ouvrir le tutoriel
                                </button>
                            </li>
                            <li class="separator"></li>
                            <li class="submenu">
                                <button class="menu-trigger">
                                    <span data-i18n="menu.language">Langue</span>
                                    <span class="material-symbols-outlined" style="font-size: 16px">chevron_right</span>
                                </button>
                                <ul class="dropdown dropdown-flyout">
                                    <li><button data-lang="fr" data-i18n="lang.french">Français</button></li>
                                    <li><button data-lang="en" data-i18n="lang.english">English</button></li>
                                </ul>
                            </li>
                            <li class="separator"></li>
                            <li>
                                <button id="menu-docs-typst" data-tauri-open-url="https://typst.app/docs/">
                                    <span data-i18n="menu.docs_typst">Documentation Typst</span>
                                    <span class="material-symbols-outlined" style="font-size: 16px">open_in_new</span>
                                </button>
                            </li>
                            <li>
                                <button id="menu-official-repo" data-tauri-open-url="https://github.com/gnoooo/typst-ide">
                                    <span data-i18n="menu.official_repo">Repo officiel de Typst IDE</span>
                                    <span class="material-symbols-outlined" style="font-size: 16px">open_in_new</span>
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- <div class="navbar-end">
        </div> -->
            </nav>
            <div class="toolbar-row">
                <span class="flex gap-2">
                    <span class="gap-2">
                        <button class="tool-btn _unsaved-blinking" id="unsaved-btn" data-i18n-title="toolbar.new_project">
                            <span class="material-symbols-outlined" id="unsaved-icon">file_save</span>
                        </button>
                        <button class="tool-btn _open-project-blinking" id="open-project-btn" data-i18n-title="toolbar.open_project">
                            <span class="material-symbols-outlined" id="open-project-icon">folder_open</span>
                        </button>
                        <button class="tool-btn" id="notepad-btn" data-i18n-title="toolbar.notepad">
                            <span class="material-symbols-outlined" id="notepad-icon">sticky_note_2</span>
                        </button>
                        <button class="tool-btn" id="manage-files-btn" data-i18n-title="toolbar.manage_files">
                            <span class="material-symbols-outlined" id="manage-files-icon">folder_managed</span>
                        </button>
                    </span>

                    <div class="file-sync-group" id="file-sync-group" hidden>
                        <button class="tool-btn file-sync-btn" id="file-sync-save-btn">
                            <span class="material-symbols-outlined" id="file-sync-save-icon">upload_file</span>
                        </button>
                        <button class="tool-btn file-sync-btn" id="file-sync-reload-btn">
                            <span class="material-symbols-outlined" id="file-sync-reload-icon">refresh</span>
                        </button>
                    </div>

                    <div class="btn-group flex justify-start" id="text-formatting-panel">
                        <button class="tool-btn" id="bold-btn" data-i18n-title="toolbar.bold">B</button>
                        <button class="tool-btn" id="italic-btn" data-i18n-title="toolbar.italic">I</button>
                        <button class="tool-btn" id="underline-btn" data-i18n-title="toolbar.underline">U</button>
                    </div>
                    <div class="menu-item" id="structures-menu">
                        <button class="tool-btn menu-trigger" id="structures-btn" data-i18n-title="toolbar.structures">
                            #
                            <span class="material-symbols-outlined" id="structures-btn-icon">chevron_right</span>
                        </button>
                        <ul class="dropdown" id="structures-dropdown">
                            <!-- Peuplé avec structures.js -->
                        </ul>
                    </div>
                </span>

                <div class="btn-group flex" id="preview-zoom-panel">
                    <button class="tool-btn" id="zoom-preview-out-btn" data-i18n-title="toolbar.preview_zoom_out">
                        -
                    </button>
                    <span class="flex items-center text-align-center" ²id="zoom-display">
                        <input
                            class="w-8"
                            id="zoom-preview-input"
                            type="number"
                            min="20"
                            max="400"
                            value="100"
                            step="10"
                        />
                        %
                    </span>
                    <button class="tool-btn" id="zoom-preview-in-btn" data-i18n-title="toolbar.preview_zoom_in">+</button>
                </div>

                <div id="preview-manage-btn" class="flex gap-2 justify-end">
                    <!--<button class="tool-btn" id="compile-btn" data-i18n="toolbar.compile">Compiler</button>-->
                    <button class="tool-btn" id="compile-btn">
                        <span class="material-symbols-outlined" style="font-size: 19px">terminal</span>
                    </button>
                    <!--<button class="tool-btn" id="save-btn" data-i18n="toolbar.save">Save</button>-->
                    <button class="tool-btn" id="save-btn">
                        <span class="material-symbols-outlined" style="font-size: 19px">save</span>
                    </button>
                </div>
            </div>

            <!-- ## Output console ####################################### -->
            <div id="output-console" class="output-console hidden">
                <div class="console-header">
                    <span data-i18n="console.title">Console de compilation</span>
                    <button id="close-console" data-i18n-title="console.close" title="Fermer">&#x2715;</button>
                </div>
                <div id="console-content" class="console-content"></div>
            </div>

            <!-- ## Main split ########################################### -->
            <div class="main-split" id="main-split">
                <div class="pane editor-pane" id="editor-pane">
                    <div id="typst-editor" class="editor-container"></div>
                </div>

                <div class="resize-handle" id="resize-handle"></div>

                <div class="pane preview-pane" id="preview-pane">
                    <!-- <div id="preview-container"> -->
                    <div id="preview" class="preview-content">
                        <iframe
                            id="preview-frame"
                            sandbox="allow-same-origin"
                        ></iframe>
                    </div>

                    <!-- </div> -->
                </div>
            </div>

            <!-- ## Status bar ########################################### -->
        </div>

        <!-- Toast container -->
        <div id="toast-container" class="toast-container"></div>
    </body>
</html>
