[package]
name = "typst-ide-app"
version = "1.5.1"
edition = "2024"

# Keep the binary named `typst-ide` (desktop entry, PKGBUILD install path…),
# while the package name `typst-ide-app` avoids clashing with the registry
# crate `typst-ide` (0.15.x) that `core` depends on.
[[bin]]
name = "typst-ide"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.1", features = [] }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typst-ide-core = { path = "../core", package = "core" }
rfd = "0.17.2"
font-kit = "0.14"
strsim = "0.11"
tauri-plugin-opener = "2"
rusqlite = { version = "0.38.0", features = ["bundled"] }
tauri-plugin-clipboard-manager = "2"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.1", features = ["devtools", "test"] }
