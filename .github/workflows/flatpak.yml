name: Flatpak

on:
  # Only main and pull requests: a tag points at a commit whose manifest still
  # pins the previous release, so a tag build would verify the wrong version.
  # The push to main after `manage.sh flatpak-bump` verifies the new release.
  push:
    branches: [main]
  pull_request:

# Le build vérifie le manifeste et n'écrit nulle part dans le dépôt.
permissions:
  contents: read

jobs:
  flatpak:
    name: "Flatpak (${{ matrix.arch }})"
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Verification build only : the official Flathub build stays on their
      # buildbot. The manifest is pinned to the last release tag, the CI
      # proves both architectures build from the vendored sources.
      # No cache-key : the action's default (hash of the manifest path) keeps
      # the .flatpak-builder cache warm between runs and invalidates it when
      # the manifest changes.
      # Pinned to commit (2026-08-25), not @master: the action runs in a
      # --privileged container, a mutable ref there is a compromise vector.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          bundle: typst-ide-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.gnoooo.typst-ide.yml
          arch: ${{ matrix.arch }}
          build-dir: target/builddir
          repo-dir: target/repo
          state-dir: target/.flatpak-builder
