name: Flatpak

on:
  # Flatpak builds are slow; only run them for release tags. The manifest pins
  # the release tag, so a tag build always resolves to the correct commit.
  push:
    tags:
      - 'v*'

# Le build vérifie le manifeste et n'écrit nulle part dans le dépôt.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: "Flatpak (${{ matrix.arch }})"
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Verification build only : the official Flathub build stays on their
      # buildbot. The checked-in manifest pins the release tag; for CI we pin
      # the exact commit the tag points to so the build-commands match.
      # No cache-key : the action's default (hash of the manifest path) keeps
      # the .flatpak-builder cache warm between runs and invalidates it when
      # the manifest changes.
      # Pinned to commit (2026-08-25), not @master: the action runs in a
      # --privileged container, a mutable ref there is a compromise vector.

      - name: Pin Flatpak manifest to current commit
        run: |
          # The checked-in manifest only pins the release tag. For CI we need the
          # exact commit under test, so replace the tag line with the current SHA
          # and drop any stale commit line from the previous release.
          sed -i 's|^        tag: v[0-9]\+\.[0-9]\+\.[0-9]\+$|        commit: ${{ github.sha }}|' packaging/flatpak/io.github.gnoooo.typst-ide.yml
          sed -i '/^        commit: [a-f0-9]\{40\}$/d' packaging/flatpak/io.github.gnoooo.typst-ide.yml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          bundle: typst-ide-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.gnoooo.typst-ide.yml
          arch: ${{ matrix.arch }}
          build-dir: target/builddir
          repo-dir: target/repo
          state-dir: target/.flatpak-builder
