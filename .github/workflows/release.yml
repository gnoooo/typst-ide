name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            xdg-utils \
            rpm \
            zsync \
            desktop-file-utils \
            appstream \
            xvfb \
            xauth \
            xdotool

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        # Pinned so releases stay reproducible (a CLI update silently changed
        # the NSIS template and broke the build once already).
        run: npm install -g @tauri-apps/cli@2.12.0

      # One command, same as local dev: builds the frontend, the bundles, and
      # post-processes the AppImage (scripts/fix-appimage.sh).
      - name: Build bundles (AppImage, deb, rpm)
        run: ./manage.sh build appimage,deb,rpm --target x86_64-unknown-linux-gnu

      # Opens a window under Xvfb: catches AppImage startup crashes
      # (EGL/WebKit/AppRun regressions) before publishing.
      - name: Smoke-test the AppImage
        run: |
          APPIMAGE=$(ls target/dist/linux/typst-ide-*.AppImage)
          chmod +x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a bash -c '
            "$1" &
            pid=$!
            for _ in $(seq 1 25); do
              if xdotool search --name "Typst IDE" >/dev/null 2>&1; then
                echo "AppImage window appeared"
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                exit 0
              fi
              kill -0 "$pid" 2>/dev/null || { echo "AppImage exited before opening a window" >&2; exit 1; }
              sleep 1
            done
            echo "No AppImage window after 25s" >&2
            kill "$pid" 2>/dev/null || true
            exit 1
          ' _ "$APPIMAGE"

      - name: Upload AppImage + zsync (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-linux-appimage
          path: |
            target/dist/linux/*.AppImage
            target/dist/linux/*.zsync
          if-no-files-found: error

      - name: Upload .deb (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-linux-deb
          path: target/dist/linux/*.deb
          if-no-files-found: warn

      - name: Upload .rpm (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-linux-rpm
          path: target/dist/linux/*.rpm
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Tauri CLI
        # Pinned so releases stay reproducible (a CLI update silently changed
        # the NSIS template and broke the build once already).
        run: npm install -g @tauri-apps/cli@2.12.0

      # Native MSVC build: WebView2Loader and the VC runtime are linked
      # statically, so the portable executable is a single self-contained
      # file (no WebView2Loader.dll next to it, unlike MinGW builds).
      - name: Build app
        working-directory: crates/app
        run: tauri build

      # Same dist/ layout as the local and Linux builds (see
      # scripts/publish-artifacts.sh).
      - name: Package artifacts into target/dist/windows
        shell: pwsh
        run: |
          $version = (Get-Content crates/app/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force target/dist/windows | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe target/dist/windows/
          Copy-Item target/release/typst-ide.exe "target/dist/windows/Typst IDE_${version}_x64-portable.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-windows-installer
          path: target/dist/windows/*setup.exe
          if-no-files-found: error

      - name: Upload Windows portable executable
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-windows-portable
          path: "target/dist/windows/Typst IDE_*_x64-portable.exe"
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    # Manual runs (workflow_dispatch) only build and upload artifacts; the
    # GitHub release itself is created for tag pushes only.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
