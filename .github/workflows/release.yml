name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Les jobs de build n'ont besoin de rien plus que read.
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            xdg-utils \
            rpm \
            zsync \
            desktop-file-utils \
            appstream \
            xvfb \
            xauth \
            xdotool \
            x11-utils \
            icewm \
            dbus

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Server-side guard: the pre-push hook checks the developer machine, this
      # one checks the release itself (a push forced with --no-verify still fails).
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit

      - name: Install Tauri CLI
        # Pinned so releases stay reproducible (a CLI update silently changed
        # the NSIS template and broke the build once already).
        run: npm install -g @tauri-apps/cli@2.12.0

      # One command, same as local dev: builds the frontend, the bundles, and
      # post-processes the AppImage (dev/scripts/fix-appimage.sh).
      - name: Build bundles (AppImage, deb, rpm)
        run: ./manage.sh build appimage,deb,rpm --target x86_64-unknown-linux-gnu

      # Opens a window under Xvfb (+ icewm, like AppImageHub) and a session
      # bus: catches AppImage startup crashes (EGL/WebKit/AppRun regressions)
      # before publishing.
      - name: Smoke-test the AppImage
        run: |
          APPIMAGE=$(ls target/dist/linux/typst-ide-*.AppImage)
          chmod +x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            dbus-run-session -- xvfb-run -a bash -c '
              icewm >/dev/null 2>&1 &
              wm=$!
              "$1" >/tmp/appimage-smoke.log 2>&1 &
              pid=$!
              found=0
              for i in $(seq 1 60); do
                if xdotool search --name "Typst IDE" >/dev/null 2>&1 \
                   || xdotool search --classname typst-ide >/dev/null 2>&1 \
                   || xdotool search --class Typst-ide >/dev/null 2>&1; then
                  echo "AppImage window appeared after ${i}s"
                  found=1
                  break
                fi
                if ! kill -0 "$pid" 2>/dev/null; then
                  echo "AppImage exited before opening a window" >&2
                  cat /tmp/appimage-smoke.log >&2 || true
                  kill "$wm" 2>/dev/null || true
                  exit 1
                fi
                sleep 1
              done
              kill "$pid" "$wm" 2>/dev/null || true
              sleep 1
              kill -9 "$pid" "$wm" 2>/dev/null || true
              if [ "$found" -ne 1 ]; then
                echo "No AppImage window after 60s" >&2
                echo "--- windows ---" >&2
                xdotool search --name "" getwindowname %@ 2>&1 | head -20 >&2 || true
                echo "--- tree ---" >&2
                xwininfo -root -tree 2>&1 | head -50 >&2 || true
                echo "--- app log ---" >&2
                cat /tmp/appimage-smoke.log >&2 || true
                exit 1
              fi
            ' _ "$APPIMAGE"

      - name: Upload AppImage + zsync (Linux)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typst-ide-linux-appimage
          path: |
            target/dist/linux/*.AppImage
            target/dist/linux/*.zsync
          if-no-files-found: error

      - name: Upload .deb (Linux)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typst-ide-linux-deb
          path: target/dist/linux/*.deb
          if-no-files-found: error

      - name: Upload .rpm (Linux)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typst-ide-linux-rpm
          path: target/dist/linux/*.rpm
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Server-side guard: the pre-push hook checks the developer machine, this
      # one checks the release itself (a push forced with --no-verify still fails).
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit

      - name: Install Tauri CLI
        # Pinned so releases stay reproducible (a CLI update silently changed
        # the NSIS template and broke the build once already).
        run: npm install -g @tauri-apps/cli@2.12.0

      # Same entry point as local builds: native MSVC build (WebView2Loader and
      # the VC runtime are linked statically, so the portable executable is a
      # single self-contained file), published into target/dist/windows via
      # dev/scripts/publish-artifacts.sh.
      - name: Build Windows bundles
        shell: bash
        run: bash ./manage.sh build windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typst-ide-windows-installer
          path: target/dist/windows/*setup.exe
          if-no-files-found: error

      - name: Upload Windows portable executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typst-ide-windows-portable
          path: "target/dist/windows/Typst IDE_*_x64-portable.exe"
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    # Manual runs (workflow_dispatch) only build and upload artifacts; the
    # GitHub release itself is created for tag pushes only.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify tag matches crate version
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/app/Cargo.toml | head -1)"
          [ "${GITHUB_REF_NAME#v}" = "$ver" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $ver" >&2; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # SHA256SUMS ships with the release so PKGBUILD (= the 'SKIP' sums) and
      # anyone else can verify the artifacts after download.
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS -print0 | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/**/*
          generate_release_notes: true
