name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            xdg-utils \
            rpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Tauri CLI
        # Pinned so releases stay reproducible (a CLI update silently changed
        # the NSIS template and broke the build once already).
        run: npm install -g @tauri-apps/cli@2.12.0

      - name: Build app
        working-directory: crates/app
        run: NO_STRIP=1 tauri build --target x86_64-unknown-linux-gnu

      - name: Upload AppImage (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-linux-appimage
          path: target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload .deb (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-linux-deb
          path: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload .rpm (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-linux-rpm
          path: target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Tauri CLI
        # Pinned so releases stay reproducible (a CLI update silently changed
        # the NSIS template and broke the build once already).
        run: npm install -g @tauri-apps/cli@2.12.0

      # Native MSVC build: WebView2Loader and the VC runtime are linked
      # statically, so the portable executable is a single self-contained
      # file (no WebView2Loader.dll next to it, unlike MinGW builds).
      - name: Build app
        working-directory: crates/app
        run: tauri build

      - name: Package portable executable
        shell: pwsh
        run: |
          $version = (Get-Content crates/app/tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item "target/release/typst-ide.exe" "target/release/Typst IDE_${version}_x64-portable.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows portable executable
        uses: actions/upload-artifact@v4
        with:
          name: typst-ide-windows-portable
          path: "target/release/Typst IDE_*_x64-portable.exe"
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    # Manual runs (workflow_dispatch) only build and upload artifacts; the
    # GitHub release itself is created for tag pushes only.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
